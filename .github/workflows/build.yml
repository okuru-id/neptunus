name: Build

# Pushing a tag like v0.2.0 builds the installers for Linux, Windows, macOS, an unsigned iOS IPA (iPhone + iPad) and an Android APK, and
# attaches them to a draft GitHub release for that tag.
# The okuru-id org keeps GITHUB_TOKEN read-only, so creating the release needs a RELEASE_TOKEN secret: a personal
# access token with Contents read/write on this repo. Without it the jobs fall back to GITHUB_TOKEN.
on:
  push:
    tags: ["v*"]

jobs:
  # The draft release comes first, so every job uploads to it as soon as its build is done.
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Notes come from release-notes/<tag>.md, or the commits since the previous tag.
          f="release-notes/$GITHUB_REF_NAME.md"
          [ -f "$f" ] || git log --pretty='- %s' "$(git describe --tags --abbrev=0 HEAD^)..HEAD" > "$f"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Neptunus $GITHUB_REF_NAME" --notes-file "$f"
          echo "id=$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    permissions:
      contents: write # upload to the draft release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04 # oldest supported glibc, so the .deb/.AppImage run on more distros
            args: ""
          - name: windows
            os: windows-latest
            args: ""
          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      # WiX and NSIS are downloaded from GitHub on every bundle; keep them so a flaky download can't fail the build.
      # Bump the key when tauri-bundler moves to newer WiX/NSIS versions.
      - name: Cache Tauri bundler tools
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-tools-windows-wix314-nsis3.13

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.id }}

      # Also keep the installers as a workflow artifact, so a failed release step doesn't lose the build.
      - name: Upload installers as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neptunus-${{ github.ref_name }}-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg

  # One universal IPA for iPhone and iPad, built without code signing (no Apple Developer secrets needed).
  # Sign it on install with your own Apple ID through AltStore or Sideloadly; a free Apple ID re-signs every 7 days.
  ios:
    needs: release
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios

      - run: npm ci
      - run: npm run tauri ios init -- --ci
      # the generated Xcode project has Tauri's default icon; src-tauri/icons/ios holds Neptunus' (tauri icon output)
      - run: cp src-tauri/icons/ios/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/
      # films play in a VLCKit screen (src-tauri/ios/NeptunusPlayer.swift) rather than the WebView
      - run: scripts/ios-vlckit.sh
      - run: npm run tauri ios build -- --ci --no-sign

      - run: mv src-tauri/gen/apple/build/arm64/*.ipa "Neptunus_${GITHUB_REF_NAME#v}_unsigned.ipa"

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: neptunus-${{ github.ref_name }}-ios
          path: Neptunus_*_unsigned.ipa

      - name: Attach IPA to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" Neptunus_*_unsigned.ipa --clobber

  # With your own Apple Developer certificate the IPA is also signed and published with a manifest.plist, so
  # the devices in the profile install updates over the air from the app (itms-services), no USB needed.
  # Secrets, all base64 except the password: IOS_P12 (.p12), IOS_P12_PASSWORD, IOS_PROFILE (.mobileprovision
  # that lists the devices). Without IOS_P12 this job does nothing.
  ios-ota:
    needs: ios
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      IOS_P12: ${{ secrets.IOS_P12 }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.IOS_P12 != ''
        with:
          name: neptunus-${{ github.ref_name }}-ios

      - name: Sign the IPA and write its manifest
        if: env.IOS_P12 != ''
        env:
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
        run: |
          curl -fsSL -o zsign.tgz https://github.com/zhlynn/zsign/releases/download/v1.1.2/zsign-linux-x86_64.tar.gz
          echo "d55e6a8650949a260892a9687ac1dfe4a9c79c2e3ecfe00a0eeb09b7b694282e  zsign.tgz" | sha256sum -c -
          tar xzf zsign.tgz zsign
          umask 077
          echo "$IOS_P12" | base64 -d > cert.p12
          echo "$IOS_PROFILE" | base64 -d > app.mobileprovision
          v=${GITHUB_REF_NAME#v}
          ./zsign -q -k cert.p12 -p "$IOS_P12_PASSWORD" -m app.mobileprovision -o "Neptunus_${v}.ipa" "Neptunus_${v}_unsigned.ipa"
          rm -f cert.p12 app.mobileprovision
          cat > manifest.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict>
            <key>assets</key><array><dict>
              <key>kind</key><string>software-package</string>
              <key>url</key><string>https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Neptunus_${v}.ipa</string>
            </dict></array>
            <key>metadata</key><dict>
              <key>bundle-identifier</key><string>id.neptunus.desktop</string>
              <key>bundle-version</key><string>${v}</string>
              <key>kind</key><string>software</string>
              <key>title</key><string>Neptunus</string>
            </dict>
          </dict></array></dict></plist>
          EOF

      - name: Attach the signed IPA and manifest to the release
        if: env.IOS_P12 != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "Neptunus_${GITHUB_REF_NAME#v}.ipa" manifest.plist --clobber --repo "$GITHUB_REPOSITORY"

  # arm64 APK (practically every phone since 2017). Signed with the ANDROID_KEYSTORE secret (base64 .jks) and
  # ANDROID_KEYSTORE_PASSWORD when set, so updates install over the previous version; otherwise with a throwaway key
  # (still installable, but each release then needs the old app uninstalled first).
  android:
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      # The runner image ships the SDK and NDK; rquickjs generates its bindings with the NDK's clang and sysroot
      - name: NDK environment
        run: |
          TC=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$TC/lib" >> "$GITHUB_ENV"
          echo "CLANG_PATH=$TC/bin/clang" >> "$GITHUB_ENV"
          # newer NDKs reject the unversioned triple bindgen passes; 26 is the minSdk in tauri.conf.json (AAudio, used by cpal)
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$TC/sysroot --target=aarch64-linux-android26" >> "$GITHUB_ENV"

      - run: npm ci
      # src-tauri/gen/android is committed (audio permission in the manifest, asked for in MainActivity)
      - run: npm run tauri android build -- --ci --apk --target aarch64

      - name: Sign APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.jks
          else
            KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            keytool -genkeypair -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -alias neptunus -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Neptunus"
          fi
          APK=$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$KEYSTORE_PASSWORD" --out "Neptunus_${GITHUB_REF_NAME#v}_arm64.apk" "$APK"
          rm release.jks

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: neptunus-${{ github.ref_name }}-android
          path: Neptunus_*_arm64.apk

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" Neptunus_*_arm64.apk --clobber
