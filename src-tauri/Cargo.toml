[package]
name = "neptunus"
version = "0.3.2"
description = "Neptunus, a lightweight desktop music player"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "neptunus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5.0"
lofty = "0.25.4"
base64 = "0.23.1"
tauri-plugin-dialog = "2.8.3"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-s3 = { version = "0.38.0", default-features = false, features = ["sync", "sync-rustls-tls"] }
attohttpc = { version = "0.30", default-features = false, features = ["tls-rustls", "json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
sha2 = "0.11.1"
md-5 = "0.11.0"
hmac = "0.13.0"
sha1 = "0.11.0"
rquickjs = "0.14.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
blowfish = "0.9"
cbc = "0.1"
aes = "0.8"
ctr = "0.9"

# rquickjs ships no prebuilt bindings for iOS/Android, so generate them there (bindgen needs libclang)
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
rquickjs = { version = "0.14.0", features = ["bindgen"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "MPNowPlayingInfoCenter", "MPMediaItem", "MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSString", "NSValue"] }
objc2 = "0.6"
block2 = "0.6"

# Desktop only: tray, OS media controls, system trash (iOS/Android have none of these)
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
trash = "5"

# Windows/macOS tray; Linux uses ksni instead (tauri-cli still sees this feature in cargo metadata, so CI installs libayatana-appindicator3-dev)
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset"] }

# Linux: StatusNotifierItem tray over D-Bus (pure Rust, no libayatana needed when bundling)
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", features = ["blocking"] }
gtk = "0.18"



# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
