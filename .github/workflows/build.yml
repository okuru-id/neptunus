name: Build

# Pushing a tag like v0.2.0 builds the installers for Linux, Windows and macOS and attaches them to
# a draft GitHub release for that tag.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write # create the draft release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04 # oldest supported glibc, so the .deb/.AppImage run on more distros
            args: ""
          - name: windows
            os: windows-latest
            args: ""
          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Neptunus ${{ github.ref_name }}
          releaseBody: See the assets below to download and install Neptunus.
          releaseDraft: true
