name: Build

# Pushing a tag like v0.2.0 builds the installers for Linux, Windows, macOS and an unsigned iOS IPA (iPhone + iPad) and
# attaches them to a draft GitHub release for that tag.
# The okuru-id org keeps GITHUB_TOKEN read-only, so creating the release needs a RELEASE_TOKEN secret: a personal
# access token with Contents read/write on this repo. Without it the jobs fall back to GITHUB_TOKEN.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write # create the draft release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04 # oldest supported glibc, so the .deb/.AppImage run on more distros
            args: ""
          - name: windows
            os: windows-latest
            args: ""
          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev librsvg2-dev patchelf libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      # WiX and NSIS are downloaded from GitHub on every bundle; keep them so a flaky download can't fail the build.
      # Bump the key when tauri-bundler moves to newer WiX/NSIS versions.
      - name: Cache Tauri bundler tools
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-tools-windows-wix314-nsis3.13

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Neptunus ${{ github.ref_name }}
          releaseBody: See the assets below to download and install Neptunus.
          releaseDraft: true

      # Also keep the installers as a workflow artifact, so a failed release step doesn't lose the build.
      - name: Upload installers as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neptunus-${{ github.ref_name }}-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg

  # One universal IPA for iPhone and iPad, built without code signing (no Apple Developer secrets needed).
  # Sign it on install with your own Apple ID through AltStore or Sideloadly; a free Apple ID re-signs every 7 days.
  ios:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios

      - run: npm ci
      - run: npm run tauri ios init -- --ci
      - run: npm run tauri ios build -- --ci --no-sign

      - run: mv src-tauri/gen/apple/build/arm64/*.ipa "Neptunus_${GITHUB_REF_NAME#v}_unsigned.ipa"

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: neptunus-${{ github.ref_name }}-ios
          path: Neptunus_*_unsigned.ipa

      - name: Attach IPA to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5 6; do gh release view "$GITHUB_REF_NAME" && break; sleep 20; done
          gh release upload "$GITHUB_REF_NAME" Neptunus_*_unsigned.ipa --clobber
